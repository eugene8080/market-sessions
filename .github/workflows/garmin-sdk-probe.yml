# A throwaway reconnaissance run, not part of the build. This sandbox cannot reach Garmin at
# all, so the only way to learn the real SDK layout and the fenix 8 / tactix 8 device
# identifiers is to ask a runner that can. Nothing here fails the job: the log is the finding.
#
# Run 1 established: developer.garmin.com, apps.garmin.com, sdks.json and the SDK manager zip
# all answer 200, and the latest SDK is Connect IQ 9.2.0 (9 June 2026). It also showed that
# sdks.json lists bare filenames rather than URLs, which is why this run builds the URL itself.
name: Connect IQ SDK probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/garmin-sdk-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pick the newest SDK out of the index
        run: |
          BASE=https://developer.garmin.com/downloads/connect-iq/sdks
          curl -sSL --max-time 30 "$BASE/sdks.json" -o sdks.json
          VERSION=$(jq -r '.[-1].version' sdks.json)
          FILE=$(jq -r '.[-1].linux' sdks.json)
          RELEASED=$(jq -r '.[-1].release' sdks.json)
          echo "latest: $VERSION, released $RELEASED"
          echo "file:   $FILE"
          echo "SDK_URL=$BASE/$FILE" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "--- does that URL exist? ---"
          curl -sSLI -o /dev/null -w 'HTTP %{http_code}  %{size_download} bytes announced\n' \
            --max-time 60 "$BASE/$FILE" || echo "HEAD failed"

      - name: Download and unpack it
        run: |
          echo "fetching $SDK_URL"
          curl -sSL --max-time 600 "$SDK_URL" -o sdk.zip || { echo "download failed"; exit 0; }
          echo "zip bytes: $(stat -c%s sdk.zip)"
          file sdk.zip
          mkdir -p sdk && unzip -q sdk.zip -d sdk || { echo "unzip failed"; exit 0; }
          echo "--- top level ---"
          ls sdk
          echo "--- bin ---"
          ls sdk/bin 2>/dev/null | head -40

      - name: Enumerate every device the SDK ships reference data for
        run: |
          chmod -R +x sdk/bin 2>/dev/null || true
          sdk/bin/monkeyc --version 2>&1 | head -2
          echo
          echo "--- device ids under sdk/resources/device-reference ---"
          ls sdk/resources/device-reference 2>/dev/null | wc -l
          echo "--- the ones you care about ---"
          ls sdk/resources/device-reference 2>/dev/null | grep -iE 'fenix8|tactix' || echo "(none matched)"

      - name: Does monkeyc accept a fenix 8 as a target?
        run: |
          # A deliberately missing jungle. If the compiler rejects the device first, the target
          # is unknown to it; if it complains about the jungle, the device resolved fine.
          for dev in fenix843mm fenix847mm tactix8 nosuchwatch; do
            echo "=== -d $dev ==="
            sdk/bin/monkeyc -d "$dev" -f /nonexistent.jungle -o /tmp/x.prg 2>&1 | head -4
            echo
          done

      - name: Where does the SDK manager get device files from?
        run: |
          curl -sSL --max-time 300 \
            https://developer.garmin.com/downloads/connect-iq/sdk-manager/connectiq-sdk-manager-linux.zip \
            -o mgr.zip || { echo "download failed"; exit 0; }
          mkdir -p mgr && unzip -q mgr.zip -d mgr || { echo "unzip failed"; exit 0; }
          chmod -R +x mgr/bin 2>/dev/null || true

          echo "--- every garmin url baked into the binary ---"
          strings mgr/bin/sdkmanager | grep -oE 'https?://[a-zA-Z0-9./_-]*' | sort -u | head -40

          echo
          echo "--- anything device or json shaped ---"
          strings mgr/bin/sdkmanager | grep -iE '(device|\.json|/downloads/)' | grep -vE '^\s*$' | sort -u | head -40

      - name: Try the obvious device index urls
        run: |
          for path in \
            downloads/connect-iq/devices/devices.json \
            downloads/connect-iq/sdks/devices.json \
            downloads/connect-iq/devices.json \
            downloads/connect-iq/device-index.json
          do
            url="https://developer.garmin.com/$path"
            code=$(curl -sSL -o /tmp/probe.out -w '%{http_code}' --max-time 25 "$url" 2>/dev/null || echo ERR)
            printf '%-6s %s\n' "$code" "$url"
            if [ "$code" = "200" ]; then echo "      first 300 chars: $(head -c 300 /tmp/probe.out)"; fi
          done

      - name: Would the manager run at all with its missing library?
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0 >/dev/null 2>&1 || true
          echo "--- with libsecret present ---"
          timeout 25 mgr/bin/sdkmanager --help 2>&1 | head -20 || echo "(exit $?)"
