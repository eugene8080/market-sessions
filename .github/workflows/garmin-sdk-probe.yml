# A throwaway reconnaissance run, not part of the build. This sandbox cannot reach Garmin at
# all, so the only way to learn the real SDK layout and the fenix 8 / tactix 8 device
# identifiers is to ask a runner that can. Nothing here fails the job: the point is the log.
name: Connect IQ SDK probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/garmin-sdk-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reachability
        run: |
          for url in \
            https://developer.garmin.com \
            https://apps.garmin.com \
            https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json \
            https://developer.garmin.com/downloads/connect-iq/sdk-manager/connectiq-sdk-manager-linux.zip \
            https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin.zip
          do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 25 "$url" 2>/dev/null || echo "ERR")
            printf '%-6s %s\n' "$code" "$url"
          done

      - name: The SDK index, if there is one
        run: |
          curl -sSL --max-time 30 \
            https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json -o sdks.json 2>/dev/null || true
          if [ -s sdks.json ]; then
            echo "bytes: $(wc -c < sdks.json)"
            echo "--- first 4000 characters ---"
            head -c 4000 sdks.json; echo
            echo "--- any linux sdk urls it mentions ---"
            grep -oE 'https?://[^"]*(lin|linux)[^"]*' sdks.json | sort -u | head -20 || echo "none matched"
          else
            echo "nothing fetched: blocked, moved, or the index lives elsewhere"
          fi

      - name: Try to install an SDK and enumerate device targets
        run: |
          URL=$(grep -oE 'https?://[^"]*(lin|linux)[^"]*\.zip' sdks.json 2>/dev/null | sort -u | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "no SDK zip URL discovered; stopping here, the index above is the finding"
            exit 0
          fi
          echo "fetching $URL"
          curl -sSL --max-time 300 "$URL" -o sdk.zip || { echo "download failed"; exit 0; }
          echo "zip bytes: $(stat -c%s sdk.zip)"
          mkdir -p sdk && unzip -q sdk.zip -d sdk || { echo "unzip failed"; exit 0; }
          echo "--- top level ---"
          ls sdk | head -30
          echo "--- bin ---"
          ls sdk/bin 2>/dev/null | head -30
          echo "--- anything device shaped ---"
          find sdk -maxdepth 3 -iname '*device*' | head -30
          echo "--- compiler version ---"
          chmod +x sdk/bin/* 2>/dev/null || true
          sdk/bin/monkeyc --version 2>&1 | head -5 || echo "monkeyc would not run"
          echo "--- do fenix 8 or tactix appear anywhere in the SDK? ---"
          grep -rIl --include='*' -iE 'fenix8|fenix 8|tactix8|tactix 8' sdk 2>/dev/null | head -10 || echo "no direct hits"
